name: Include-specific-property
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/include-test.yml"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [20.x, 21.x]
        include:
          - os: ubuntu-latest
            node-version: 20.x
            tag: experimental
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Fail if experimental
        if: matrix.tag == 'experimental'
        run: exit 1
      - run: echo "Running tests"