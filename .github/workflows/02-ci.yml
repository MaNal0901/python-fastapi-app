
name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  lint:
    name: Lint - Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Vérifier le code avec Ruff
        run: ruff check .

  build:
    name: Build - Vérifier l'application
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compiler l'application
        run: python -m compileall app

      - name: Vérifier l'import de l'application
        run: python -c "from app.main import app; print(app.title)"

  test:
    name: Test - Pytest
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Exécuter les tests
        run: pytest
